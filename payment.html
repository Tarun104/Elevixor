<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subscriptions</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .subscription-message {
            width: min(100%, 620px);
            padding: 48px 32px;
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 20px;
            background: #1e293b;
            text-align: center;
            box-shadow: 0 20px 60px rgba(2, 6, 23, 0.4);
        }

        .subscription-message h1 {
            margin: 0 0 16px;
            color: #93c5fd;
            font-size: clamp(1.75rem, 5vw, 2.5rem);
        }

        .subscription-message p {
            margin: 0;
            color: #cbd5e1;
            font-size: 1.05rem;
            line-height: 1.7;
        }
    </style>
</head>

<body>
    <main class="subscription-message">
        <h1>Subscriptions</h1>
        <p>You haven't purchased any services yet. Your purchased services will appear here.</p>
    </main>
</body>

</html>
